<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lizard Man Multiplayer</title>
    <!-- PeerJS Library untuk Koneksi Multiplayer Gratis -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        #lobby {
            margin-bottom: 10px;
            background: #222;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        input, button {
            padding: 8px 12px;
            font-size: 14px;
            margin: 2px;
            border-radius: 4px;
            border: none;
        }
        button {
            background-color: #28a745;
            color: white;
            cursor: pointer;
        }
        button:hover { background-color: #218838; }
        canvas {
            border: 4px solid #fff;
            background-color: #5c94fc;
        }
    </style>
</head>
<body>

<div id="lobby">
    <span id="status">Status: Belum Terhubung</span> | 
    <button onclick="createRoom()">Buat Room (Player 1)</button>
    <br><br>
    <input type="text" id="roomIdInput" placeholder="Masukkan ID Room">
    <button onclick="joinRoom()">Gabung Room (Player 2)</button>
</div>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- SETUP MULTIPLAYER (PEERJS) ---
    let peer = null;
    let conn = null;
    let isHost = false;

    function createRoom() {
        peer = new Peer();
        peer.on('open', (id) => {
            document.getElementById('status').innerText = "ID Room Kamu: " + id + " (Kirim ke Player 2)";
            isHost = true;
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
        });
    }

    function joinRoom() {
        const targetId = document.getElementById('roomIdInput').value.trim();
        if (!targetId) return alert("Masukkan ID Room terlebih dahulu!");

        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect(targetId);
            setupConnection();
        });
    }

    function setupConnection() {
        document.getElementById('status').innerText = "Status: TERHUBUNG! Selamat Bermain.";
        
        conn.on('data', (data) => {
            // Menerima posisi lawan dari jaringan
            otherPlayer.x = data.x;
            otherPlayer.y = data.y;
        });
    }

    // --- GAMBAR KARAKTER ---
    let imageLoaded = false;
    const marioImg = new Image();
    marioImg.src = 'https://snipboard.io/thcYHg.jpg'; // File gambar lokal / URL
    marioImg.onload = () => { imageLoaded = true; };

    // --- KARAKTER & DUNIAGAME ---
    const worldWidth = 3200;
    let cameraX = 0;

    // Player Kita
    const player = {
        x: 50,
        y: 280,
        width: 70,
        height: 60,
        speed: 5,
        velY: 0,
        jumping: false
    };

    // Player Lain (Lawan)
    const otherPlayer = {
        x: 50,
        y: 280,
        width: 70,
        height: 60
    };

    const gravity = 0.6;
    const groundY = 320;

    // Objek Level
    const pipes = [
        { x: 300, y: 300, width: 50, height: 80 },
        { x: 650, y: 280, width: 50, height: 100 },
        { x: 1200, y: 260, width: 50, height: 120 }
    ];

    const blocks = [
        { x: 180, y: 240, width: 40, height: 30 },
        { x: 450, y: 200, width: 80, height: 30 },
        { x: 900, y: 220, width: 100, height: 30 }
    ];

    // Controls
    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
            e.preventDefault();
        }
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    function update() {
        // Kontrol Jalan & Lompat
        if (keys['ArrowRight'] || keys['d'] || keys['D']) {
            if (player.x < worldWidth - player.width) player.x += player.speed;
        }
        if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
            if (player.x > 0) player.x -= player.speed;
        }
        if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) && !player.jumping) {
            player.velY = -12;
            player.jumping = true;
        }

        // Gravitasi
        player.velY += gravity;
        player.y += player.velY;

        if (player.y >= groundY) {
            player.y = groundY;
            player.velY = 0;
            player.jumping = false;
        }

        // Kirim Koordinat Realtime ke Lawan
        if (conn && conn.open) {
            conn.send({ x: player.x, y: player.y });
        }

        // Kamera Mengikuti Karakter Kita
        cameraX = player.x - canvas.width / 3;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-cameraX, 0);

        // Tanah
        ctx.fillStyle = '#c84c0c';
        ctx.fillRect(0, 380, worldWidth, 20);

        // Pipa
        ctx.fillStyle = '#00a800';
        pipes.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

        // Balok
        ctx.fillStyle = '#fcb000';
        blocks.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        // GAMBAR KARAKTER KITA (Lizard Man)
        if (imageLoaded) {
            ctx.drawImage(marioImg, player.x, player.y, player.width, player.height);
        } else {
            ctx.fillStyle = '#228B22';
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        // GAMBAR KARAKTER LAWAN (Lizard Man dengan efek Bayangan Merah)
        if (imageLoaded) {
            ctx.drawImage(marioImg, otherPlayer.x, otherPlayer.y, otherPlayer.width, otherPlayer.height);
            // Penanda Kotak Merah Transparan di atas Player 2 biar tidak tertukar
            ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.fillRect(otherPlayer.x, otherPlayer.y, otherPlayer.width, otherPlayer.height);
        } else {
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(otherPlayer.x, otherPlayer.y, otherPlayer.width, otherPlayer.height);
        }

        ctx.restore();
    }

    update();
</script>

</body>
</html>
