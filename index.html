<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lizard Man Long Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #5c94fc;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h3>Gunakan A / D / SPASI (Panah) untuk jalan ke kanan!</h3>
<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- MEMUAT GAMBAR KARAKTER ---
    let imageLoaded = false;
    const marioImg = new Image();
    
    // Ganti 'lizard.png' jika kamu pakai link langsung
    marioImg.src = 'https://snipboard.io/tXknSv.jpg'; 

    marioImg.onload = () => { imageLoaded = true; };

    // --- MAP & KAMERA ---
    const worldWidth = 3200; // Lebar dunia game (4x lipat dari layar biasa)
    let cameraX = 0;

    // --- PLAYER ---
    const mario = {
        x: 50,
        y: 280,
        width: 70,  
        height: 60, 
        speed: 5,
        velY: 0,
        jumping: false
    };

    const gravity = 0.6;
    const groundY = 320; 

    // --- PIPA (Tersebar sepanjang arena) ---
    const pipes = [
        { x: 300, y: 300, width: 50, height: 80 },
        { x: 650, y: 280, width: 50, height: 100 },
        { x: 1100, y: 260, width: 50, height: 120 },
        { x: 1550, y: 300, width: 50, height: 80 },
        { x: 2000, y: 270, width: 50, height: 110 },
        { x: 2500, y: 250, width: 50, height: 130 }
    ];

    // --- BALOK MELAYANG (Tersebar) ---
    const blocks = [
        { x: 180, y: 240, width: 40, height: 30 },
        { x: 220, y: 240, width: 40, height: 30 },
        { x: 450, y: 200, width: 80, height: 30 },
        { x: 850, y: 220, width: 100, height: 30 },
        { x: 1300, y: 190, width: 120, height: 30 },
        { x: 1750, y: 220, width: 80, height: 30 },
        { x: 2200, y: 180, width: 100, height: 30 },
        { x: 2700, y: 210, width: 80, height: 30 }
    ];

    // --- MUSUH (Tersebar di beberapa titik) ---
    const enemies = [
        { x: 400, y: 350, width: 30, height: 30, speed: 2, dir: -1, minX: 360, maxX: 580 },
        { x: 950, y: 350, width: 30, height: 30, speed: 2, dir: -1, minX: 800, maxX: 1050 },
        { x: 1450, y: 350, width: 30, height: 30, speed: 3, dir: -1, minX: 1350, maxX: 1500 },
        { x: 1900, y: 350, width: 30, height: 30, speed: 2, dir: -1, minX: 1700, maxX: 1950 },
        { x: 2400, y: 350, width: 30, height: 30, speed: 3, dir: -1, minX: 2250, maxX: 2480 }
    ];

    // --- BENDERA FINISH ---
    const finishFlag = { x: 3000, y: 180, width: 20, height: 200 };

    // Controls
    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
            e.preventDefault();
        }
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    function checkCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
    }

    function update() {
        // Gerak Kiri / Kanan
        if (keys['ArrowRight'] || keys['d'] || keys['D']) {
            if (mario.x < worldWidth - mario.width) mario.x += mario.speed;
        }
        if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
            if (mario.x > 0) mario.x -= mario.speed;
        }

        // Lompat
        if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) && !mario.jumping) {
            mario.velY = -12;
            mario.jumping = true;
        }

        // Gravitasi
        mario.velY += gravity;
        mario.y += mario.velY;

        // Pijakan Tanah
        if (mario.y >= groundY) {
            mario.y = groundY;
            mario.velY = 0;
            mario.jumping = false;
        }

        // Pijakan Balok Melayang
        blocks.forEach(b => {
            if (mario.x + mario.width > b.x && mario.x < b.x + b.width) {
                if (mario.y + mario.height >= b.y && mario.y + mario.height <= b.y + 15 && mario.velY >= 0) {
                    mario.y = b.y - mario.height;
                    mario.velY = 0;
                    mario.jumping = false;
                }
            }
        });

        // Tabrakan Pipa
        pipes.forEach(p => {
            if (checkCollision(mario, p)) {
                if (mario.y + mario.height - mario.velY <= p.y) {
                    mario.y = p.y - mario.height;
                    mario.velY = 0;
                    mario.jumping = false;
                } else {
                    if (keys['ArrowRight'] || keys['d']) mario.x = p.x - mario.width;
                    if (keys['ArrowLeft'] || keys['a']) mario.x = p.x + p.width;
                }
            }
        });

        // Musuh
        enemies.forEach(e => {
            e.x += e.speed * e.dir;
            if (e.x <= e.minX || e.x >= e.maxX) e.dir *= -1;

            if (checkCollision(mario, e)) {
                alert("Game Over! Kena musuh.");
                mario.x = 50;
                mario.y = 280;
            }
        });

        // Cek Menang / Finish
        if (checkCollision(mario, finishFlag)) {
            alert("SELAMAT! Kamu berhasil mencapai Finish!");
            mario.x = 50;
            mario.y = 280;
        }

        // --- SISTEM KAMERA BERGERAK ---
        cameraX = mario.x - canvas.width / 3;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Geser kanvas sesuai posisi Kamera
        ctx.save();
        ctx.translate(-cameraX, 0);

        // 1. Gambar Tanah Panjang
        ctx.fillStyle = '#c84c0c';
        ctx.fillRect(0, 380, worldWidth, 20);

        // 2. Gambar Pipa
        ctx.fillStyle = '#00a800';
        pipes.forEach(p => {
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(p.x, p.y, p.width, p.height);
        });

        // 3. Gambar Balok
        ctx.fillStyle = '#fcb000';
        blocks.forEach(b => {
            ctx.fillRect(b.x, b.y, b.width, b.height);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(b.x, b.y, b.width, b.height);
        });

        // 4. Gambar Musuh
        ctx.fillStyle = '#a84400';
        enemies.forEach(e => {
            ctx.fillRect(e.x, e.y, e.width, e.height);
        });

        // 5. BENDERA FINISH (Garis Hijau + Kotak Merah)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(finishFlag.x, finishFlag.y, finishFlag.width, finishFlag.height);
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(finishFlag.x + 20, finishFlag.y, 40, 30);

        // 6. GAMBAR KARAKTER LIZARD MAN
        if (imageLoaded) {
            ctx.drawImage(marioImg, mario.x, mario.y, mario.width, mario.height);
        } else {
            ctx.fillStyle = '#228B22';
            ctx.fillRect(mario.x, mario.y, mario.width, mario.height);
        }

        ctx.restore(); // Kembalikan posisi kanvas
    }

    update();
</script>

</body>
</html>
