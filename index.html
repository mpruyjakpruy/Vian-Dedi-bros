<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lizard Man Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #5c94fc;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h3>Klik layar game, gunakan A / D / SPASI untuk main!</h3>
<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- MEMUAT GAMBAR LIZARD MAN ---
    let imageLoaded = false;
    const marioImg = new Image();
    marioImg.src = 'https://i.ibb.co/0j298qY/lizard.png';

    marioImg.onload = () => {
        imageLoaded = true;
    };

    // --- MARIO / PLAYER ---
    const mario = {
        x: 50,
        y: 280,
        width: 70,  
        height: 60, 
        speed: 5,
        velY: 0,
        jumping: false
    };

    const gravity = 0.6;
    const groundY = 320; 

    // --- RINTANGAN & OBJEK ---
    const pipes = [
        { x: 300, y: 300, width: 50, height: 80 },
        { x: 600, y: 280, width: 50, height: 100 }
    ];

    const blocks = [
        { x: 180, y: 240, width: 40, height: 30 },
        { x: 220, y: 240, width: 40, height: 30 },
        { x: 450, y: 200, width: 80, height: 30 }
    ];

    const enemies = [
        { x: 400, y: 350, width: 30, height: 30, speed: 2, dir: -1 }
    ];

    // Controls
    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
            e.preventDefault();
        }
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    function checkCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
    }

    function update() {
        // Gerak Kiri / Kanan
        if (keys['ArrowRight'] || keys['d'] || keys['D']) {
            if (mario.x < canvas.width - mario.width) mario.x += mario.speed;
        }
        if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
            if (mario.x > 0) mario.x -= mario.speed;
        }

        // Lompat
        if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) && !mario.jumping) {
            mario.velY = -12;
            mario.jumping = true;
        }

        // Gravitasi
        mario.velY += gravity;
        mario.y += mario.velY;

        // Pijakan Tanah
        if (mario.y >= groundY) {
            mario.y = groundY;
            mario.velY = 0;
            mario.jumping = false;
        }

        // Pijakan Balok Melayang
        blocks.forEach(b => {
            if (mario.x + mario.width > b.x && mario.x < b.x + b.width) {
                if (mario.y + mario.height >= b.y && mario.y + mario.height <= b.y + 15 && mario.velY >= 0) {
                    mario.y = b.y - mario.height;
                    mario.velY = 0;
                    mario.jumping = false;
                }
            }
        });

        // Tabrakan Pipa
        pipes.forEach(p => {
            if (checkCollision(mario, p)) {
                if (mario.y + mario.height - mario.velY <= p.y) {
                    mario.y = p.y - mario.height;
                    mario.velY = 0;
                    mario.jumping = false;
                } else {
                    if (keys['ArrowRight'] || keys['d']) mario.x = p.x - mario.width;
                    if (keys['ArrowLeft'] || keys['a']) mario.x = p.x + p.width;
                }
            }
        });

        // Musuh
        enemies.forEach(e => {
            e.x += e.speed * e.dir;
            if (e.x <= 250 || e.x >= 550) e.dir *= -1;

            if (checkCollision(mario, e)) {
                alert("Game Over! Kena musuh.");
                mario.x = 50;
                mario.y = 280;
            }
        });

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Gambar Tanah
        ctx.fillStyle = '#c84c0c';
        ctx.fillRect(0, 380, canvas.width, 20);

        // 2. Gambar Pipa Hijau
        ctx.fillStyle = '#00a800';
        pipes.forEach(p => {
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(p.x, p.y, p.width, p.height);
        });

        // 3. Gambar Balok Kuning
        ctx.fillStyle = '#fcb000';
        blocks.forEach(b => {
            ctx.fillRect(b.x, b.y, b.width, b.height);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(b.x, b.y, b.width, b.height);
        });

        // 4. Gambar Musuh
        ctx.fillStyle = '#a84400';
        enemies.forEach(e => {
            ctx.fillRect(e.x, e.y, e.width, e.height);
        });

        // 5. GAMBAR KARAKTER
        if (imageLoaded) {
            // Jika gambar lizard.png berhasil dimuat
            ctx.drawImage(marioImg, mario.x, mario.y, mario.width, mario.height);
        } else {
            // Jika gambar belum dimuat / gagal, tampilkan kotak hijau
            ctx.fillStyle = '#228B22';
            ctx.fillRect(mario.x, mario.y, mario.width, mario.height);
        }
    }

    // Jalankan game secara langsung
    update();
</script>

</body>
</html>
