<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lizard Man 2 Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #5c94fc;
        }
    </style>
</head>
<body>

<h3>P1: Tombol A/D/W | P2: Tombol Panah (Kiri/Kanan/Atas)</h3>
<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- MEMUAT GAMBAR KARAKTER ---
    let imageLoaded = false;
    const marioImg = new Image();
    marioImg.src = 'https://snipboard.io/thcYHg.jpg'; // atau URL gambar kamu
    marioImg.onload = () => { imageLoaded = true; };

    const worldWidth = 3200;
    let cameraX = 0;
    const gravity = 0.6;
    const groundY = 320;

    // --- PLAYER 1 ---
    const p1 = {
        x: 50,
        y: 280,
        width: 70,
        height: 60,
        speed: 5,
        velY: 0,
        jumping: false
    };

    // --- PLAYER 2 ---
    const p2 = {
        x: 120,
        y: 280,
        width: 70,
        height: 60,
        speed: 5,
        velY: 0,
        jumping: false
    };

    // Objek Game
    const pipes = [
        { x: 300, y: 300, width: 50, height: 80 },
        { x: 650, y: 280, width: 50, height: 100 },
        { x: 1200, y: 260, width: 50, height: 120 }
    ];

    const blocks = [
        { x: 180, y: 240, width: 40, height: 30 },
        { x: 450, y: 200, width: 80, height: 30 },
        { x: 900, y: 220, width: 100, height: 30 }
    ];

    // Controls
    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
            e.preventDefault();
        }
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    function updatePlayer(player, isP2) {
        // Kontrol Player 1 (A/D/W/Space)
        if (!isP2) {
            if (keys['KeyD']) if (player.x < worldWidth - player.width) player.x += player.speed;
            if (keys['KeyA']) if (player.x > 0) player.x -= player.speed;
            if ((keys['KeyW'] || keys['Space']) && !player.jumping) {
                player.velY = -12;
                player.jumping = true;
            }
        } 
        // Kontrol Player 2 (Panah)
        else {
            if (keys['ArrowRight']) if (player.x < worldWidth - player.width) player.x += player.speed;
            if (keys['ArrowLeft']) if (player.x > 0) player.x -= player.speed;
            if (keys['ArrowUp'] && !player.jumping) {
                player.velY = -12;
                player.jumping = true;
            }
        }

        // Gravitasi & Pijakan
        player.velY += gravity;
        player.y += player.velY;

        if (player.y >= groundY) {
            player.y = groundY;
            player.velY = 0;
            player.jumping = false;
        }

        // Balok
        blocks.forEach(b => {
            if (player.x + player.width > b.x && player.x < b.x + b.width) {
                if (player.y + player.height >= b.y && player.y + player.height <= b.y + 15 && player.velY >= 0) {
                    player.y = b.y - player.height;
                    player.velY = 0;
                    player.jumping = false;
                }
            }
        });
    }

    function update() {
        updatePlayer(p1, false);
        updatePlayer(p2, true);

        // Kamera mengikuti posisi tengah antara Player 1 dan Player 2
        let avgX = (p1.x + p2.x) / 2;
        cameraX = avgX - canvas.width / 3;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-cameraX, 0);

        // Tanah
        ctx.fillStyle = '#c84c0c';
        ctx.fillRect(0, 380, worldWidth, 20);

        // Pipa & Balok
        ctx.fillStyle = '#00a800';
        pipes.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

        ctx.fillStyle = '#fcb000';
        blocks.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        // --- GAMBAR PLAYER 1 ---
        if (imageLoaded) {
            ctx.drawImage(marioImg, p1.x, p1.y, p1.width, p1.height);
        } else {
            ctx.fillStyle = '#228B22';
            ctx.fillRect(p1.x, p1.y, p1.width, p1.height);
        }

        // --- GAMBAR PLAYER 2 (Diberi filter warna merah) ---
        if (imageLoaded) {
            ctx.drawImage(marioImg, p2.x, p2.y, p2.width, p2.height);
            ctx.fillStyle = 'rgba(255, 0, 0, 0.35)'; // Warna tint merah
            ctx.fillRect(p2.x, p2.y, p2.width, p2.height);
        } else {
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(p2.x, p2.y, p2.width, p2.height);
        }

        ctx.restore();
    }

    update();
</script>

</body>
</html>
